name: ISR probe

# Probes a storefront deploy for real cache behaviour (Cache-Status + age/ttl).
# `isr` can be inert, or served by the wrong cache layer, while the build and the
# config both still look correct - only the deployed response proves it.
#
# Triggers:
# - deployment_status: requires Netlify to publish GitHub deployment
#   notifications for the site. At the time of writing it does not, so this is
#   opportunistic; the scheduled isr-monitor.yml is the automatic safety net.
# - workflow_dispatch: probe any deploy URL on demand.
#
# Production probe failures fail the run; preview failures fail the job only.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Deploy URL to probe (defaults to production)
        required: false
        type: string

concurrency:
  group: isr-probe-${{ github.event.deployment_status.environment || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      STOREFRONT_SITE: unrivaled-manatee-77f112
      STOREFRONT_PROD_URL: https://arc.hau.sarl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deploy URL
        id: target
        env:
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_URL" ]]; then
            url="$INPUT_URL"
          elif [[ "$ENVIRONMENT" == "production" ]]; then
            url="$STOREFRONT_PROD_URL"
          else
            url="${ENVIRONMENT_URL:-$TARGET_URL}"
          fi

          if [[ -z "$url" ]]; then
            echo "Skipping: no deploy URL available"
            exit 0
          fi

          if [[ -z "$INPUT_URL" && "$url" != *"$STOREFRONT_SITE"* && "$url" != "$STOREFRONT_PROD_URL" ]]; then
            echo "Skipping: $url does not belong to the storefront site"
            exit 0
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Probing $url (environment: ${ENVIRONMENT:-manual})"

      - name: Probe ISR
        if: steps.target.outputs.url != ''
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -o pipefail
          ./apps/storefront/scripts/check-isr.sh "$URL" / \
            --expect 3600 \
            --control /search \
            --attempts 10 \
            --interval 6 \
            --require-no-cookie \
            --payload 2>&1 | tee isr-probe.log

      - name: Write summary
        if: always() && steps.target.outputs.url != ''
        run: |
          {
            echo '### ISR probe'
            echo
            echo "- deploy: ${{ steps.target.outputs.url }}"
            echo "- environment: ${{ github.event.deployment_status.environment || 'manual' }}"
            echo
            echo '```'
            cat isr-probe.log 2>/dev/null || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
