name: ISR probe

# Probes a storefront deploy for real cache behaviour (Cache-Status + age/ttl).
# `isr` can be inert, or served by the wrong cache layer, while the build and the
# config both still look correct - only the deployed response proves it.
#
# Netlify does not create GitHub Deployments, so `deployment_status` never fires
# for this site. It does publish a commit status per deploy preview, whose
# target_url is the preview URL:
#   context: netlify/unrivaled-manatee-77f112/deploy-preview
# The `status` event carries those, so preview deploys are probed on creation.
#
# Production deploys publish no GitHub event; isr-monitor.yml probes production
# every 15 minutes instead. Manual dispatch probes any URL.

on:
  status:
  workflow_dispatch:
    inputs:
      url:
        description: Deploy URL to probe (defaults to production)
        required: false
        type: string

concurrency:
  group: isr-probe-${{ github.event.context || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    # Every commit status on a PR fires this event; filter before allocating
    # the runner. The site name is repeated inline because job-level `if` has no
    # access to the job env.
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'status'
        && github.event.state == 'success'
        && github.event.context == 'netlify/unrivaled-manatee-77f112/deploy-preview')
    runs-on: ubuntu-latest
    env:
      STOREFRONT_SITE: unrivaled-manatee-77f112
      STOREFRONT_PROD_URL: https://arc.hau.sarl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deploy URL
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATUS_URL: ${{ github.event.target_url }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            url="${INPUT_URL:-$STOREFRONT_PROD_URL}"
          else
            url="$STATUS_URL"
          fi

          if [[ -z "$url" ]]; then
            echo "Skipping: no deploy URL available"
            exit 0
          fi

          if [[ "$url" != *"$STOREFRONT_SITE"* && "$url" != "$STOREFRONT_PROD_URL" ]]; then
            echo "Skipping: $url does not belong to the storefront site"
            exit 0
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Probing $url"

      - name: Probe ISR
        if: steps.target.outputs.url != ''
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -o pipefail
          ./apps/storefront/scripts/check-isr.sh "$URL" / \
            --expect 3600 \
            --control /cart \
            --attempts 8 \
            --interval 5 \
            --require-no-cookie \
            --payload 2>&1 | tee isr-probe.log

      - name: Write summary
        if: always() && steps.target.outputs.url != ''
        run: |
          {
            echo '### ISR probe'
            echo
            echo "- deploy: ${{ steps.target.outputs.url }}"
            echo "- trigger: ${{ github.event_name }}"
            echo
            echo '```'
            cat isr-probe.log 2>/dev/null || echo 'no probe output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
