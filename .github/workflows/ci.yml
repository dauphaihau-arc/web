name: CI

on:
  pull_request:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      storefront: ${{ steps.filter.outputs.storefront }}
      seller: ${{ steps.filter.outputs.seller }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed app scopes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
          else
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              base_ref="$(git rev-list --max-parents=0 HEAD)"
            else
              base_ref="${{ github.event.before }}"
            fi
          fi

          changed_files="$(git diff --name-only "$base_ref" HEAD)"

          storefront=false
          seller=false
          admin=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/workflows/*|apps/storefront/*|packages/*|pnpm-workspace.yaml|package.json|pnpm-lock.yaml)
                storefront=true
                ;;
            esac

            case "$file" in
              .github/workflows/*|apps/seller/*|packages/*|pnpm-workspace.yaml|package.json|pnpm-lock.yaml)
                seller=true
                ;;
            esac

            case "$file" in
              .github/workflows/*|apps/admin/*|packages/*|pnpm-workspace.yaml|package.json|pnpm-lock.yaml)
                admin=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            storefront=true
            seller=true
            admin=true
          fi

          echo "storefront=$storefront" >> "$GITHUB_OUTPUT"
          echo "seller=$seller" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"

  storefront:
    needs: changes
    if: needs.changes.outputs.storefront == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile
        working-directory: ${{ github.workspace }}
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Prepare storefront Nuxt artifacts
        run: pnpm --filter @arc/storefront exec nuxt prepare

      - name: Lint storefront
        run: pnpm lint:storefront

      - name: Typecheck storefront
        run: pnpm typecheck:storefront

      - name: Test storefront
        run: pnpm --filter @arc/storefront test

      - name: Build storefront
        env:
          NITRO_PRESET: netlify
        run: pnpm build:storefront

      # `isr` only works on the Netlify preset and breaks silently if a route is
      # prerendered or the preset regresses, so assert the built artifact.
      - name: Assert ISR contract
        working-directory: ${{ github.workspace }}
        run: node apps/storefront/scripts/assert-isr.mjs

  seller:
    needs: changes
    if: needs.changes.outputs.seller == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile
        working-directory: ${{ github.workspace }}
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Prepare seller Nuxt artifacts
        run: pnpm --filter @arc/seller exec nuxt prepare

      - name: Lint seller
        run: pnpm lint:seller

      - name: Typecheck seller
        run: pnpm typecheck:seller

      - name: Test seller
        run: pnpm --filter @arc/seller test

      - name: Build seller
        run: pnpm build:seller

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile
        working-directory: ${{ github.workspace }}
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Prepare admin Nuxt artifacts
        run: pnpm --filter @arc/admin exec nuxt prepare

      - name: Lint admin
        run: pnpm lint:admin

      - name: Typecheck admin
        run: pnpm typecheck:admin

      - name: Test admin
        run: pnpm --filter @arc/admin test

      - name: Build admin
        run: pnpm build:admin

  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Verify generated API types match the published contract
        run: pnpm generate:api-types -- --check
