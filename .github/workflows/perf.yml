name: Performance

# Nightly Lighthouse run against the deployed storefront. Not part of PR CI:
# production pages sit behind ISR and a real API, so a PR-time score would mix
# cached and uncached renders and jitter on shared runners. Bundle budgets are
# the deterministic PR gate and run in ci.yml from the built artifacts.
#
# Set the repository variable LHCI_URLS (comma-separated) to measure more than
# the landing page. Only server-rendered routes are meaningful; the checkout,
# cart, account, orders, and guest-orders routes are `ssr: false` shells.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: perf-lighthouse
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile
        working-directory: ${{ github.workspace }}
        run: test -f pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Run Lighthouse CI
        env:
          LHCI_URLS: ${{ vars.LHCI_URLS }}
          # The healthcheck looks for an upload credential even though
          # `upload.target: filesystem` posts no statuses. LHCI reads
          # `LHCI_GITHUB_TOKEN` (yargs `.env('LHCI')` -> `githubToken`), not
          # `GITHUB_TOKEN`.
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `dlx` keeps the Lighthouse toolchain out of the workspace install that
        # every PR job pays for; this workflow is the only consumer.
        run: pnpm dlx @lhci/cli@0.16.1 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
