[build]
  command = "pnpm --filter @arc/storefront build"
  publish = "apps/storefront/dist"
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- apps/storefront packages package.json pnpm-lock.yaml pnpm-workspace.yaml"

# Nitro's Netlify server bundling needs the same heap allowance as seller.
[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
# Installing the workspace needs @dauphaihau-arc/api-spec from GitHub Packages; the
# site environment must provide NODE_AUTH_TOKEN with read:packages.
